name: Daily GitHub Trending to Feishu

on:
  push:
    branches:
      - main
  schedule:
    - cron: "10 8 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-trending:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[trending-initial-run]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch and send GitHub Trending
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python github_trending.py

